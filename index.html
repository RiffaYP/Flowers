<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1724" />
  <meta name="description" content="Bunga yang mekar untukmu — ketuk untuk memulai." />
  <title>Flowers — Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- START OVERLAY -->
  <div id="startOverlay" class="overlay">
    <div class="startBox">
      <h1>Flowers</h1>
      <p>Ketuk untuk memulai</p>
      <button id="startBtn" type="button">Mulai</button>
    </div>
  </div>

  <!-- MAIN SCENE -->
  <main id="stage">
    <div id="scene" aria-hidden="true">
      <div id="flowerWrap">
        <div id="flower">
          <div class="petals"></div>
          <div class="center"></div>
          <div class="stem"></div>
          <div class="leaf leaf-left"></div>
          <div class="leaf leaf-right"></div>
        </div>
      </div>
      <div id="hearts"></div>
    </div>

    <!-- POPUP -->
    <div id="popup" class="popup hidden" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <div class="popup-card">
        <button id="closePopup" class="close" type="button" aria-label="Tutup">&times;</button>
        <h2 id="popupTitle">Surprise untuk kamu</h2>
        <p>Semoga harimu penuh bunga dan senyuman.</p>
        <button id="again" class="primary" type="button">Tampilkan lagi</button>
      </div>
    </div>
  </main>

  <!-- FALLING PETALS -->
  <div id="petalContainer" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
