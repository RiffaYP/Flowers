<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1724" />
  <meta name="description" content="Bunga yang mekar untukmu — ketuk untuk memulai." />
  <meta property="og:title" content="Flowers — Surprise" />
  <meta property="og:description" content="Bunga yang mekar untukmu." />
  <title>Flowers — Surprise</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- START OVERLAY -->
  <div id="startOverlay" class="overlay">
    <div class="startBox">
      <h1>Flowers</h1>
      <p id="startGreeting">Ketuk untuk memulai</p>
      <button id="startBtn" type="button">Mulai</button>
    </div>
  </div>

  <!-- MAIN SCENE -->
  <main id="stage">
    <div id="scene" aria-hidden="true">
      <svg id="flower" viewBox="0 0 400 460" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="petalGrad" cx="50%" cy="20%" r="80%">
            <stop offset="0%"   stop-color="#fff4f8" />
            <stop offset="35%"  stop-color="#ffd0e0" />
            <stop offset="72%"  stop-color="#ff8db7" />
            <stop offset="100%" stop-color="#ff6b95" />
          </radialGradient>
          <radialGradient id="petalGradInner" cx="50%" cy="22%" r="78%">
            <stop offset="0%"   stop-color="#ffffff" />
            <stop offset="40%"  stop-color="#ffe0ec" />
            <stop offset="100%" stop-color="#ffb0cd" />
          </radialGradient>
          <radialGradient id="coreGrad" cx="42%" cy="38%" r="70%">
            <stop offset="0%"   stop-color="#fff1c2" />
            <stop offset="60%"  stop-color="#ffcf6e" />
            <stop offset="100%" stop-color="#e79a1f" />
          </radialGradient>
          <linearGradient id="stemGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%"   stop-color="#1f7d45" />
            <stop offset="45%"  stop-color="#3fbf6f" />
            <stop offset="100%" stop-color="#1f7d45" />
          </linearGradient>
          <linearGradient id="leafGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#5fd88a" />
            <stop offset="100%" stop-color="#1f7d45" />
          </linearGradient>

          <path id="petalShape"
                d="M0,0 C -46,-34 -54,-108 0,-150 C 54,-108 46,-34 0,0 Z" />

          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#7d2340" flood-opacity="0.25"/>
          </filter>
        </defs>

        <g id="stemGroup">
          <rect class="stem" x="196" y="196" width="8" height="170" rx="4" fill="url(#stemGrad)" />
          <path class="leaf leaf-left"  d="M200,300 C150,286 120,300 118,338 C160,346 196,332 200,318 Z" fill="url(#leafGrad)" />
          <path class="leaf leaf-right" d="M204,318 C254,304 284,318 286,356 C244,364 208,350 204,336 Z" fill="url(#leafGrad)" />
        </g>

        <g id="petals"></g>

        <g id="coreGroup">
          <circle cx="200" cy="196" r="30" fill="url(#coreGrad)" filter="url(#softShadow)" />
          <g class="core-dots" fill="#b9741c" opacity="0.55">
            <circle cx="188" cy="186" r="2.2" /><circle cx="204" cy="182" r="2.2" />
            <circle cx="214" cy="196" r="2.2" /><circle cx="200" cy="200" r="2.2" />
            <circle cx="186" cy="203" r="2.2" /><circle cx="198" cy="214" r="2.2" />
            <circle cx="212" cy="208" r="2.2" /><circle cx="190" cy="196" r="2.2" />
            <circle cx="206" cy="194" r="2.2" />
          </g>
        </g>
      </svg>

      <div id="hearts"></div>
    </div>

    <!-- POPUP -->
    <div id="popup" class="popup hidden" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <div class="popup-card">
        <button id="closePopup" class="close" type="button" aria-label="Tutup">&times;</button>
        <h2 id="popupTitle">Surprise untuk kamu</h2>
        <p id="popupMsg">Semoga harimu penuh bunga dan senyuman.</p>
        <div class="popup-actions">
          <button id="again" class="primary" type="button">Surprise lagi</button>
          <button id="share" class="secondary" type="button">Bagikan</button>
          <button id="saveImg" class="secondary" type="button">Simpan PNG</button>
        </div>
      </div>
    </div>
  </main>

  <!-- FALLING PETALS -->
  <div id="petalContainer" aria-hidden="true"></div>

  <!-- toast for copy fallback -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="flower.js" defer></script>
  <script src="effects.js" defer></script>
</body>
</html>
